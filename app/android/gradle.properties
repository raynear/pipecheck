org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flutter 3.44 템플릿 기준 opt-out — AGP 9의 newDsl/builtInKotlin은 Flutter Gradle 플러그인과 아직 비호환
android.newDsl=false
android.builtInKotlin=false
# Manifest가 광고 AAR 리소스(@xml/gma_ad_services_config)를 앱 네임스페이스로 참조 —
# non-transitive R(신 AGP 기본 true)에서는 링킹 실패하므로 opt-out 유지
android.nonTransitiveRClass=false
org.gradle.configuration-cache=false
