name: pipecheck
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.1+1
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ===================================
  # Local Packages (Core)
  # ===================================
  ads:
    path: packages/ads
  authentication:
    path: packages/authentication
  biometric_auth:
    path: packages/biometric_auth
  firebase_services:
    path: packages/firebase_services
  notifications:
    path: packages/notifications
  notifications_fcm:
    path: packages/notifications_fcm
  positioning:
    path: packages/positioning
  utils:
    path: packages/utils

  # ===================================
  # Core Dependencies (Required)
  # ===================================
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  collection: ^1.18.0
  # DST-correct reminder scheduling (core/services/scheduling). Matches the
  # notifications package constraint so resolution stays on one tz version.
  timezone: ^0.10.0
  app_links: ^7.1.2
  crypto: ^3.0.0
  easy_localization: ^3.0.7
  flutter_dotenv: ^6.0.0
  flutter_localized_locales: ^2.0.5
  flutter_riverpod: ^3.0.3
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^17.0.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  logger: ^2.5.0
  orange: ^1.2.8
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.0
  url_launcher: ^6.3.1

  # ===================================
  # Database (Core)
  # ===================================
  drift: ^2.21.0
  drift_sqflite: ^2.0.1

  # ===================================
  # UI Components (Core)
  # ===================================
  flex_color_scheme: ^8.2.0
  flutter_animate: ^4.5.2
  flutter_keyboard_visibility: ^6.0.0
  flutter_spinkit: ^5.2.1
  flutter_vector_icons: ^2.0.0
  lottie: ^3.3.1
  modal_bottom_sheet: ^3.0.0
  panara_dialogs: ^0.1.5
  pin_code_fields: ^8.0.1
  sheet: ^1.0.0
  smooth_page_indicator: ^2.0.1
  stylish_bottom_bar: ^1.1.0
  top_snackbar_flutter: ^3.1.0

  # ===================================
  # Firebase (Optional - disable via AppFeatureConfig)
  # ===================================
  # firebase_analytics / crashlytics / remote_config는 firebase_services
  # 패키지로 이전 (P2-20c). firebase_messaging은 notifications_fcm 패키지로 이전 (PR4).
  # firebase_core만 앱 잔류 (firebase_options.dart + Firebase.initializeApp).
  firebase_core: ^4.3.0

  # ===================================
  # Monetization (Optional - disable via AppFeatureConfig)
  # ===================================
  # google_mobile_ads는 ads 패키지로 이전 (P2-20c). app/lib는 직접 참조 안 함
  # (AdContainer도 google_mobile_ads 타입 비의존 — aspectRatio double 주입).
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.10

  # ===================================
  # Notifications (Optional)
  # ===================================
  # awesome_notifications(+_core)는 notifications 패키지로 이전 (P2-20c PR3).
  # firebase_messaging/flutter_local_notifications는 notifications_fcm 패키지로 이전 (PR4).
  # timezone: core/services/scheduling(DST 정확 리마인더 엔진)이 직접 사용 — 직접
#   의존을 상단 dependencies에 선언(notifications 패키지와 동일 ^0.10.0 제약).

  # ===================================
  # Features (Optional - enable as needed)
  # ===================================
  # Auth & Privacy
  app_tracking_transparency: ^2.0.6
  # geolocator는 positioning 패키지로 이전 (P2 location 패키지화). app/lib 직접 사용 0.
  permission_handler: ^12.0.0+1

  # Onboarding
  introduction_screen: ^4.0.0

  # Media
  file_picker: ^10.1.9
  image_picker: ^1.1.2
  share_plus: ^10.1.4

  # ===================================
  # Common UI (Pre-built)
  # ===================================
  cached_network_image: ^3.4.1
  infinite_scroll_pagination: ^4.1.0

  # Misc
  confetti: ^0.8.0

  # ===================================
  # A/B Testing (Optional)
  # ===================================
  ab_testing:
    path: packages/ab_testing

  # ===================================
  # Removed from Core (moved to examples/)
  # Uncomment if needed for your app:
  # ===================================
  # archive: ^4.0.7
  # audio_session: ^0.2.1
  # audio_waveforms: ^2.0.1
  # audioplayers: ^6.1.0
  # camera: ^0.11.0+2
  # flutter_openmoji: ^0.0.8
  # flutter_soloud: ^3.1.3
  # flutter_sound: ^9.28.0
  # gallery_saver_plus: ^3.2.8
  # google_maps_flutter: ^2.12.1
  home_widget: ^0.8.0
  # icloud_storage: ^2.2.0
  # image: ^4.5.4
  # image_gallery_saver: ^2.0.3
  # record: ^6.0.0
  # simple_audio_trimmer: ^0.1.4
  # vibration: ^3.1.3
  # workmanager: ^0.9.0+3
  #
  # (geofence_foreground_service/flutter_heatmap_calendar vendored 패키지는
  #  P1-16c에서 소유 앱 flowmodoro repo로 퇴거 — docs/MODULES.md 참조)

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: "^2.4.15"
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  # Table generator dependencies (dev-only — builder/generators는 build 엔트리포인트만
  # 도달, 런타임 미도달이라 출시 바이너리에 포함되지 않음)
  analyzer: ^8.1.1
  build: ^4.0.3
  source_gen: ^4.1.1

# flutter_launcher_icons 설정은 app/flutter_launcher_icons.yaml이 단일 SSOT다.
# (standalone 파일이 pubspec 섹션을 가리므로 중복 정의는 footgun — P0-8)

flutter:
  uses-material-design: true

  assets:
  - config/default_font.json
  - config/env/.env.debug
  - config/env/.env.profile
  - config/env/.env.release
  - assets/data/badges.json
  - assets/images/
  - assets/images/badges/
  - assets/languages/
  - assets/lottie/
  - assets/launcher_icon/
  - assets/legal/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: Kalam
      fonts:
        - asset: assets/fonts/Kalam-Regular.ttf
        - asset: assets/fonts/Kalam-Bold.ttf
          weight: 700
