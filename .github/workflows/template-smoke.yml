name: Template Smoke

# 템플릿 스모크 테스트 (informational) — GOAL_AUDIT_ROADMAP.md P0-2
#
# fresh checkout에서 fork 골든 패스를 재현한다:
#   fixture로 루트 project.yaml 편집 → ./run init → codegen → flutter build (debug)
#
# 시크릿을 일절 사용하지 않는다 — fork PR에서도 그대로 동작해야 하는 경로이므로
# secrets에 의존하는 순간 스모크의 의미가 깨진다.
#
# ⚠️ P0-3(home-widget Kotlin 잔재 삭제)·P0-5(rename 재작성) 완료 전까지 red가 예상값.
#    그때까지 branch protection required check에 추가하지 말 것.
#    required 승격 시점: P0-5 완료 후 (로드맵 "항목 5까지 non-required").

on:
  pull_request:
    branches: [main, develop]
  schedule:
    # 매주 월요일 06:00 KST (일요일 21:00 UTC) — PR이 없는 주에도 Flutter stable 드리프트 감지
    - cron: "0 21 * * 0"
  workflow_dispatch:

concurrency:
  group: template-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-android:
    name: Smoke Android (fork → init → codegen → debug apk)
    # PR마다 Linux에서 실행. 주간 cron에도 포함 (드리프트 감지 비용 0).
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # fork가 "루트 3파일 편집"하는 단계를 재현 — 템플릿 기본값과 다른 정체성 주입
      - name: Apply CI fixture (project.yaml)
        run: cp .github/fixtures/smoke-project.yaml project.yaml

      # 외부 계정/도구가 필요한 step은 전부 skip — 남는 코어 경로:
      # config 로드 → 패키지명 변경(rename) → env 산출물 → profile → pub get → analyze
      - name: Run init
        run: |
          ./run init \
            --skip-signing \
            --skip-codegen \
            --skip-icon \
            --skip-description \
            --skip-metadata \
            --skip-legal \
            --skip-firebase \
            --skip-store \
            --verbose

      # codegen을 init과 분리 실행 — init은 step soft-fail이라 합치면 실패 지점이 묻힌다
      - name: Codegen (env artifacts + build_runner + drift sync)
        run: ./run build

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

  smoke-ios:
    name: Smoke iOS (weekly, no-codesign)
    # macOS는 비싸므로 주간 cron + 수동 트리거만 (로드맵: "Linux PR + macOS 주간 cron")
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply CI fixture (project.yaml)
        run: cp .github/fixtures/smoke-project.yaml project.yaml

      - name: Run init
        run: |
          ./run init \
            --skip-signing \
            --skip-codegen \
            --skip-icon \
            --skip-description \
            --skip-metadata \
            --skip-legal \
            --skip-firebase \
            --skip-store \
            --verbose

      - name: Codegen (env artifacts + build_runner + drift sync)
        run: ./run build

      - name: Build iOS (debug, no codesign)
        working-directory: app
        run: flutter build ios --debug --no-codesign
