# ============================================================
# apps.yaml — 파생 앱 레지스트리
# ============================================================
# scripts/sync-to-apps 가 이 파일을 읽어 동기화 대상 앱을 결정한다.
#
# 새 파생 앱은 여기 등록:
#   - name: 앱 식별자 (sync-to-apps --app <name> 에 사용)
#     path: 로컬 경로 (~ 는 $HOME 으로 확장됨)

apps:
  - name: kanken
    path: ~/Project/kanken
  - name: hanja
    path: ~/Project/hanja
  - name: snapdic
    path: ~/Project/snapdic
  - name: flowmodoro
    path: ~/Project/flowmodoro
